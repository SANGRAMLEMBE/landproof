[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landproof"
version = "0.1.0"
description = "Proof-carrying emergency landing for drones: open-vocabulary hazards, SAM 3.1-verified certificates, and a descent watch that aborts when the zone stops being safe."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Sangram Lembe" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "pillow>=10.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "tqdm>=4.66",
  "openai>=1.40",
  "meta-sam-parser>=0.1.0",
  "imageio-ffmpeg>=0.5",   # bundled ffmpeg for MP4 export (Windows has no system ffmpeg)
]

[project.optional-dependencies]
student = ["torch>=2.2", "torchvision>=0.17"]
modal = ["modal>=1.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["landproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
